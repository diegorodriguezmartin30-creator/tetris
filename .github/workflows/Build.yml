name: Build Windows EXE

# Se ejecuta cada vez que subes cambios a la rama "main"
# y tambien se puede lanzar a mano desde la pestana "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # runner con Windows real, gratis para repos publicos

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (pygame + pyinstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generar el ejecutable con PyInstaller
        run: pyinstaller --onefile --windowed --name Tetris main.py

      - name: Publicar el .exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Tetris-Windows
          path: dist/Tetris.exe
